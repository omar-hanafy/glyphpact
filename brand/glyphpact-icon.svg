<!--
  GlyphPact standalone icon: the identity mark on its own tile.

  Use this variant wherever the mark cannot inherit a text colour - README
  headers, the favicon, repository avatars, social profiles. Colours are
  explicit and match brand/tokens.json.

  The geometry is identical to brand/glyphpact-mark.svg, scaled from the
  32x32 mark grid onto a 64x64 tile (inset 6, scaled 1.625x).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill-rule="evenodd" role="img" aria-label="GlyphPact">
  <rect width="64" height="64" rx="14" fill="#0B0D10" />
  <g transform="translate(6 6) scale(1.625)">
    <g fill="#E9ECF1">
      <path d="M2.5 2.5H10.5V6.5H6.5V10.5H2.5Z" />
      <path d="M29.5 2.5H21.5V6.5H25.5V10.5H29.5Z" />
      <path d="M2.5 29.5H10.5V25.5H6.5V21.5H2.5Z" />
      <path d="M29.5 29.5H21.5V25.5H25.5V21.5H29.5Z" />
    </g>
    <path fill="#22D3EE" d="M16 11.5 20.5 16 16 20.5 11.5 16Z" />
  </g>
</svg>
