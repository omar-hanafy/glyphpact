name: Site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "brand/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "site/**"
      - "brand/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Never cancel a deployment already in flight; a half-published site is worse
  # than a slightly stale one.
  group: pages-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: site

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so scripts/check-claims.mjs can assert that the version
          # the site advertises corresponds to a real release tag. A shallow
          # checkout carries no tags and the assertion would silently skip.
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install from the committed lockfile
        run: npm ci

      - name: Type-check content and components
        run: npm run check

      - name: Check brand artwork contracts
        run: npm run check:brand

      - name: Build
        run: npm run build

      - name: Check for unsupported product claims
        run: npm run check:claims

      - name: Check links, metadata, structured data, and sitemap
        run: npm run check:links

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    name: Deploy to GitHub Pages
    # Pull requests build and verify but never publish.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
