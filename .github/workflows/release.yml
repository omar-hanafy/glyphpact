name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_pypi:
        description: Publish the verified distributions to PyPI
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  SOURCE_DATE_EPOCH: "0"

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked --all-groups --all-extras
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest
      - run: uv build --clear --no-sources
      - run: uvx --from twine twine check dist/*
      - id: version
        shell: bash
        run: |
          version="$(uv run python -c 'from glyphpact import __version__; print(__version__)')"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${version}." >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
      - run: uv run python plugins/glyphpact/scripts/sync_wheel.py --check dist/glyphpact-1.0.0-py3-none-any.whl
      - run: uv run pytest plugins/glyphpact/tests
      - run: uv run python plugins/glyphpact/scripts/validate_plugin.py
      - name: Smoke-test the packaged MCP from a copied plugin cache
        shell: bash
        run: |
          plugin_cache="${RUNNER_TEMP}/glyphpact-plugin-cache"
          mkdir -p "${plugin_cache}"
          cp -R "${GITHUB_WORKSPACE}/plugins/glyphpact/." "${plugin_cache}/"
          cd "${RUNNER_TEMP}"
          uv run --no-project --isolated --no-config \
            --with-requirements "${plugin_cache}/dist/mcp-requirements.txt" \
            python "${plugin_cache}/scripts/smoke_mcp.py" \
            --plugin-root "${plugin_cache}"
      - uses: actions/upload-artifact@v7
        with:
          name: glyphpact-${{ steps.version.outputs.version }}
          path: dist/*
          if-no-files-found: error

  github-release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: glyphpact-${{ needs.build.outputs.version }}
          path: dist
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes --verify-tag

  pypi:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_pypi
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/glyphpact/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: glyphpact-${{ needs.build.outputs.version }}
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
