name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  SOURCE_DATE_EPOCH: "0"

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Verify the release tag is contained in the default branch
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" != "push" || "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "Releases must run from a pushed tag." >&2
            exit 1
          fi
          git fetch --no-tags origin \
            "refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" "origin/${DEFAULT_BRANCH}"; then
            echo "Tag ${GITHUB_REF_NAME} is not contained in ${DEFAULT_BRANCH}." >&2
            exit 1
          fi
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked --all-groups --all-extras
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest
      - run: uv build --clear --no-sources
      - run: uv run --group release twine check dist/*
      - id: version
        shell: bash
        run: |
          version="$(uv run python -c 'from glyphpact import __version__; print(__version__)')"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${version}." >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
      - run: uv run python plugins/glyphpact/scripts/sync_wheel.py --check dist/glyphpact-${{ steps.version.outputs.version }}-py3-none-any.whl
      - run: uv run pytest plugins/glyphpact/tests
      - run: uv run python plugins/glyphpact/scripts/validate_plugin.py
      - name: Smoke-test the packaged MCP from a copied plugin cache
        shell: bash
        run: |
          plugin_cache="${RUNNER_TEMP}/glyphpact-plugin-cache"
          mkdir -p "${plugin_cache}"
          cp -R "${GITHUB_WORKSPACE}/plugins/glyphpact/." "${plugin_cache}/"
          cd "${RUNNER_TEMP}"
          uv run --no-project --isolated --no-config \
            --with-requirements "${plugin_cache}/dist/mcp-requirements.txt" \
            python "${plugin_cache}/scripts/smoke_mcp.py" \
            --plugin-root "${plugin_cache}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: glyphpact-${{ steps.version.outputs.version }}
          path: dist/*
          if-no-files-found: error

  github-release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: glyphpact-${{ needs.build.outputs.version }}
          path: dist
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" dist/*
          --repo "${GITHUB_REPOSITORY}"
          --generate-notes
          --verify-tag

  pypi:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/glyphpact/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: glyphpact-${{ needs.build.outputs.version }}
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          attestations: true
