name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  SOURCE_DATE_EPOCH: "0"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked --all-groups --all-extras
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest
      - run: uv lock --check

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked --all-groups --all-extras
      - run: uv build --clear --no-sources
      - run: uvx --from twine twine check dist/*
      - name: Smoke-test the installed wheel
        run: |
          uv venv .wheel-smoke
          uv pip install --python .wheel-smoke/bin/python "dist/glyphpact-1.0.0-py3-none-any.whl"
          .wheel-smoke/bin/python tests/wheel_smoke.py
      - run: uv run --with pip-audit pip-audit --local
      - run: uvx check-jsonschema --check-metaschema schema/*.json
      - run: uvx check-jsonschema --schemafile schema/icon-font-config.schema.json examples/icon_font.json
      - name: Compile and check the public example
        run: |
          uv run glyphpact --config examples/icon_font.json
          uv run glyphpact --config examples/icon_font.json --check
      - uses: actions/upload-artifact@v7
        with:
          name: glyphpact-distributions
          path: dist/*
          if-no-files-found: error

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9
        with:
          python-version: "3.13"
          enable-cache: true
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: uv sync --locked --all-groups --all-extras
      - run: uv run pytest tests/test_flutter_integration.py
        env:
          RUN_FLUTTER_TESTS: "1"

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked --all-groups --all-extras
      - run: uv build --clear --no-sources
      - run: uv run python plugins/glyphpact/scripts/sync_wheel.py --check dist/glyphpact-1.0.0-py3-none-any.whl
      - run: uv run pytest plugins/glyphpact/tests
      - run: uv run python plugins/glyphpact/scripts/validate_plugin.py
      - name: Smoke-test the packaged MCP from a copied plugin cache
        shell: bash
        run: |
          plugin_cache="${RUNNER_TEMP}/glyphpact-plugin-cache"
          mkdir -p "${plugin_cache}"
          cp -R "${GITHUB_WORKSPACE}/plugins/glyphpact/." "${plugin_cache}/"
          cd "${RUNNER_TEMP}"
          uv run --no-project --isolated --no-config \
            --with-requirements "${plugin_cache}/dist/mcp-requirements.txt" \
            python "${plugin_cache}/scripts/smoke_mcp.py" \
            --plugin-root "${plugin_cache}"
