name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  SOURCE_DATE_EPOCH: "0"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked --all-groups --all-extras
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest
      - run: uv lock --check

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked --all-groups --all-extras
      - run: uv build --clear --no-sources
      - run: uv run --group release twine check dist/*
      - name: Smoke-test the installed wheel
        run: |
          uv venv .wheel-smoke
          uv pip install --python .wheel-smoke/bin/python dist/glyphpact-*-py3-none-any.whl
          .wheel-smoke/bin/python tests/wheel_smoke.py
      - run: uv run --group release pip-audit --local
      - run: uv run --group release check-jsonschema --check-metaschema schema/*.json
      - run: uv run --group release check-jsonschema --schemafile schema/icon-font-config.schema.json examples/icon_font.json
      - name: Compile and check the public example
        run: |
          uv run glyphpact --config examples/icon_font.json
          uv run glyphpact --config examples/icon_font.json --check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: glyphpact-distributions
          path: dist/*
          if-no-files-found: error

  flutter-integration:
    name: Flutter integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          python-version: "3.13"
          enable-cache: true
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.44.8"
          cache: true
      - run: uv sync --locked --all-groups --all-extras
      - run: uv run pytest tests/test_flutter_integration.py
        env:
          RUN_FLUTTER_TESTS: "1"

  dart-format:
    name: Dart ${{ matrix.dart }} format (language ${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - flutter: "3.10.0"
            dart: "3.0"
            language: "3.0"
            marker_supported: "0"
          - flutter: "3.27.0"
            dart: "3.6"
            language: "3.6"
            marker_supported: "0"
          - flutter: "3.29.0"
            dart: "3.7"
            language: "3.7"
            marker_supported: "1"
          - flutter: "3.44.8"
            dart: "3.12"
            language: "3.0"
            marker_supported: "0"
          - flutter: "3.44.8"
            dart: "3.12"
            language: "3.7"
            marker_supported: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          python-version: "3.13"
          enable-cache: true
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ matrix.flutter }}
          cache: true
      - run: uv sync --locked --all-groups --all-extras
      - run: >-
          uv run pytest
          tests/test_flutter_integration.py::test_catalog_is_stable_across_supported_dart_formatters
        env:
          RUN_DART_FORMAT_TESTS: "1"
          EXPECTED_DART_SERIES: ${{ matrix.dart }}
          FORMATTER_LANGUAGE_VERSION: ${{ matrix.language }}
          FORMATTER_MARKER_SUPPORTED: ${{ matrix.marker_supported }}

  flutter:
    name: flutter
    if: ${{ always() }}
    needs: [flutter-integration, dart-format]
    runs-on: ubuntu-latest
    steps:
      - name: Require Flutter integration and every Dart formatter gate
        env:
          FLUTTER_INTEGRATION_RESULT: ${{ needs['flutter-integration'].result }}
          DART_FORMAT_RESULT: ${{ needs['dart-format'].result }}
        run: |
          test "${FLUTTER_INTEGRATION_RESULT}" = "success"
          test "${DART_FORMAT_RESULT}" = "success"

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked --all-groups --all-extras
      - run: uv build --clear --no-sources
      - run: uv run python plugins/glyphpact/scripts/sync_wheel.py --check dist/glyphpact-*-py3-none-any.whl
      - run: uv run pytest plugins/glyphpact/tests
      - run: uv run python plugins/glyphpact/scripts/validate_plugin.py
      - name: Smoke-test the packaged MCP from a copied plugin cache
        shell: bash
        run: |
          plugin_cache="${RUNNER_TEMP}/glyphpact-plugin-cache"
          mkdir -p "${plugin_cache}"
          cp -R "${GITHUB_WORKSPACE}/plugins/glyphpact/." "${plugin_cache}/"
          cd "${RUNNER_TEMP}"
          uv run --no-project --isolated --no-config \
            --with-requirements "${plugin_cache}/dist/mcp-requirements.txt" \
            python "${plugin_cache}/scripts/smoke_mcp.py" \
            --plugin-root "${plugin_cache}"
